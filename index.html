<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Used Cars</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <body>
    <header>
      <div class="logo">Cheshire Motors</div>
      <div class="nav">
        <ul>
          <li><a href="financing.hmtl">Financing</a></li>
          <li><a href="used-cars.html">Used Cars</a></li>
          <li><a href="new-cars.html">New Cars</a></li>
          <li><a href="enquire.html">Enquire</a></li>
          <li></li>
        </ul>
      </div>

      <div class="actions">
        <img class="heart" src="/images/heart.png" alt="heart" />
        <a class="sign" href="signin.html">Sign In</a>
      </div>
    </header>
    <div class="hero">
      <img class="logo-image" src="/images/logo2.png" alt="" />
      <div class="search">
        <div class="dropdown-item">
          <select class="dropdown-item__select" id="car-type" name="car-type">
            <option value="">Any Make</option>
            <option value="sedan">Mercedes</option>
            <option value="suv">Audi</option>
            <option value="car">BMW</option>
          </select>
        </div>
        <div class="dropdown-item">
          <select class="dropdown-item__select" id="car-type" name="car-type">
            <option value="">Any Size</option>
            <option value="sedan">4x4</option>
            <option value="suv">Prestige</option>
            <option value="car">Van</option>
          </select>
        </div>
        <div class="dropdown-item">
          <select class="dropdown-item__select" id="car-type" name="car-type">
            <option value="">Price</option>
            <option value="sedan">Under 5k</option>
            <option value="suv">5k>10k</option>
            <option value="car">10k>15k</option>
          </select>
        </div>
        <button class="search-button">Search Deals</button>
      </div>
    </div>

    <div class="car-grid">
      <div class="grid-item">
        <img
          class="grid-item__image"
          src="https://cdn1.leasing.com/izmo/Pix/leapmotor/c10/1/5suv%20design/leapmotor_24c10evdesignsu1fr_lowaggressive.webp?fixar=true&width=400&height=267"
          alt=""
        />
        <button class="grid-item__button">View</button>
      </div>
      <div class="grid-item">
        <img
          class="grid-item__image"
          src="https://cdn1.leasing.com/izmo/Pix/volkswagen/transporter/7/4cargovan%20commerceswb/volkswagen_26transportercomrceswbvc7fruk_lowaggressive.webp?fixar=true&width=400&height=267"
          alt=""
        />
        <button class="grid-item__button">View</button>
      </div>
      <div class="grid-item">
        <img
          class="grid-item__image"
          src="https://cdn1.leasing.com/izmo/Pix/volkswagen/amarok/2/4pickup%20aventura/volkswagen_23amarokventura4wdtc2b_lowaggressive.webp?fixar=true&width=400&height=267"
          alt=""
        />
        <button class="grid-item__button">View</button>
      </div>
    </div>

    <div class="box">
      <div class="box-item">
        <img
          class="box-item__image"
          src="https://static.vecteezy.com/system/resources/thumbnails/046/726/497/small/man-holds-the-car-keys-and-locks-it-buying-and-selling-cars-test-drive-photo.jpg"
          alt=""
        />
        <div class="about-text">
          <h2>Not sure what to look for?</h2>
          <p>
            Use our simple tool to tell us what you're looking for, and we'll
            recommend cars and lease deals tailored to your needs, in seconds.
          </p>
          <button class="box-item__search">Find Your Dream Car</button>
        </div>
      </div>
    </div>
  </body>
</html>
